apiVersion: v1
kind: Secret
metadata:
  name: rutomq-postgres
type: Opaque
stringData:
  database-url: postgres://rutomq:rutomq@postgres:5432/rutomq
---
apiVersion: v1
kind: Secret
metadata:
  name: rutomq-object-store
type: Opaque
stringData:
  access-key-id: minioadmin
  secret-access-key: minioadmin
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: rutomq-test-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rutomq-test-postgres
  template:
    metadata:
      labels:
        app: rutomq-test-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: rutomq
            - name: POSTGRES_PASSWORD
              value: rutomq
            - name: POSTGRES_DB
              value: rutomq
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "rutomq", "-d", "rutomq"]
            periodSeconds: 1
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app: rutomq-test-minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rutomq-test-minio
  template:
    metadata:
      labels:
        app: rutomq-test-minio
    spec:
      automountServiceAccountToken: false
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: ["server", "/data"]
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 1
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: rutomq-test-minio-init
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: minio-client
          image: minio/mc:latest
          command: ["/bin/sh", "-c"]
          args:
            - >-
              until mc alias set local http://minio:9000 minioadmin minioadmin;
              do sleep 1; done;
              mc mb --ignore-existing local/rutomq
