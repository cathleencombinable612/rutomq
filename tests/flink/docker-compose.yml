services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rutomq
      POSTGRES_PASSWORD: rutomq
      POSTGRES_DB: rutomq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rutomq -d rutomq"]
      interval: 1s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
        mc mb --ignore-existing local/rutomq

  rutomq:
    image: rutomq:flink-it
    command: agent
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://rutomq:rutomq@postgres:5432/rutomq
      OBJECT_STORE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: rutomq
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      KAFKA_ADVERTISE_HOST: rutomq
      KAFKA_ADVERTISE_PORT: 9092
      RUTOMQ_NUM_PARTITIONS: 3
      RUTOMQ_DEFAULT_REPLICATION_FACTOR: 1
      RUTOMQ_FLUSH_INTERVAL_MS: 25
      RUTOMQ_MAX_BATCH_BYTES: 1048576
      RUTOMQ_MAX_REQUEST_PARTITION_SIZE_LIMIT: 2
      RUTOMQ_COMPACTION_INTERVAL_MS: 100
      RUTOMQ_COMPACTION_LEASE_MS: 30000
      RUTOMQ_COMPACTION_MAX_OBJECT_BYTES: 1048576
      RUTOMQ_TRANSACTION_TWO_PHASE_COMMIT_ENABLE: "true"
      RUTOMQ_ACL_ENABLED: "true"
      RUTOMQ_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
      RUST_LOG: rutomq=debug
    ports:
      - "${RUTOMQ_FLINK_KAFKA_PORT:-19092}:9092"
      - "${RUTOMQ_FLINK_HEALTH_PORT:-18080}:8080"

  jobmanager:
    image: ${FLINK_IMAGE:-flink:2.2.1-scala_2.12-java21}
    command: jobmanager
    depends_on:
      - rutomq
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        jobmanager.execution.failover-strategy: region
    ports:
      - "${RUTOMQ_FLINK_UI_PORT:-18081}:8081"
    volumes:
      - ./target/rutomq-flink-it.jar:/opt/flink/usrlib/rutomq-flink-it.jar:ro

  taskmanager:
    image: ${FLINK_IMAGE:-flink:2.2.1-scala_2.12-java21}
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
    volumes:
      - ./target/rutomq-flink-it.jar:/opt/flink/usrlib/rutomq-flink-it.jar:ro
