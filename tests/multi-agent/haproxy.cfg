global
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 2s
    timeout client 30s
    timeout server 30s

frontend kafka
    bind *:9092
    default_backend agents

backend agents
    balance roundrobin
    option tcp-check
    server agent1 agent1:9092 check inter 200ms fall 1 rise 1
    server agent2 agent2:9092 check inter 200ms fall 1 rise 1
    server agent3 agent3:9092 check inter 200ms fall 1 rise 1
