services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rutomq
      POSTGRES_PASSWORD: rutomq
      POSTGRES_DB: rutomq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rutomq -d rutomq"]
      interval: 1s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
        mc mb --ignore-existing local/rutomq

  rutomq:
    image: rutomq:security-it
    command: agent
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://rutomq:rutomq@postgres:5432/rutomq
      OBJECT_STORE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: rutomq
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      KAFKA_ADVERTISE_HOST: rutomq
      KAFKA_ADVERTISE_PORT: 9092
      KAFKA_TLS_CERT_FILE: /certs/server.crt
      KAFKA_TLS_KEY_FILE: /certs/server.key
      RUTOMQ_SCRAM_USERS_JSON: '{"admin":"admin-secret","alice":"correct-horse","bob":"bob-secret"}'
      RUTOMQ_SASL_ENABLED: "true"
      RUTOMQ_DELEGATION_TOKEN_SECRET: "rutomq-security-delegation-token-secret"
      RUTOMQ_ACL_ENABLED: "true"
      RUTOMQ_SUPER_USERS: "User:admin"
      RUTOMQ_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      RUTOMQ_FLUSH_INTERVAL_MS: 25
      RUST_LOG: rutomq=debug
    ports:
      - "19093:9092"
      - "18083:8080"
    volumes:
      - ./runtime:/certs:ro
