global
  log stdout format raw local0

defaults
  mode tcp
  log global
  timeout connect 2s
  timeout client 2m
  timeout server 2m

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s

frontend kafka
  bind :9092
  default_backend agents

backend agents
  balance roundrobin
  option tcp-check
  server agent1 agent1:9092 check inter 500ms fall 2 rise 1 resolvers docker init-addr libc,none
  server agent2 agent2:9092 check inter 500ms fall 2 rise 1 resolvers docker init-addr libc,none
  server agent3 agent3:9092 check inter 500ms fall 2 rise 1 resolvers docker init-addr libc,none
