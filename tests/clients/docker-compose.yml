services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rutomq
      POSTGRES_PASSWORD: rutomq
      POSTGRES_DB: rutomq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rutomq -d rutomq"]
      interval: 1s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
        mc mb --ignore-existing local/rutomq

  rutomq:
    image: rutomq:clients-it
    command: agent
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://rutomq:rutomq@postgres:5432/rutomq
      OBJECT_STORE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: rutomq
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      KAFKA_ADVERTISE_HOST: rutomq
      KAFKA_ADVERTISE_PORT: 9092
      RUTOMQ_FLUSH_INTERVAL_MS: 25
      RUTOMQ_MAX_BATCH_BYTES: 1048576
      RUST_LOG: rutomq=info
    ports:
      - "${RUTOMQ_CLIENTS_KAFKA_PORT:-19094}:9092"
      - "${RUTOMQ_CLIENTS_HEALTH_PORT:-18084}:8080"
