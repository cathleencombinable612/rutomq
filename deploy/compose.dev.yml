services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rutomq
      POSTGRES_PASSWORD: rutomq
      POSTGRES_DB: rutomq
    ports:
      - "5432:5432"
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/rutomq"
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: migrate
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://rutomq:rutomq@postgres:5432/rutomq
  rutomq:
    build:
      context: ..
      dockerfile: Dockerfile
    command: agent
    depends_on:
      - postgres
      - minio-init
    environment:
      DATABASE_URL: postgres://rutomq:rutomq@postgres:5432/rutomq
      OBJECT_STORE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: rutomq
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      KAFKA_ADVERTISE_HOST: 127.0.0.1
      KAFKA_ADVERTISE_PORT: 9092
    ports:
      - "9092:9092"
      - "8080:8080"
